[tools]
gh = "2.99.0"
gitleaks = "8.30"
jq = "1.8.2"
hk = "1.57.0"
actionlint = "latest"
shellcheck = "latest"
"github:sakuro/factorix" = "0.23.0"

[hooks]
# hk install: skipped in CI (GitHub Actions sets CI); hk falls back to script shims on Git < 2.54.
# git submodule update --init: this repo (unlike the scaffold) has references/ submodules
# that need bootstrapping on a fresh clone.
postinstall = [
  'test -n "$CI" || hk install',
  'git submodule update --init',
]

[settings]
minimum_release_age = "3d"

[task_config]
includes = ["tasks"]

[env]
# Make `hk install` generate hooks that run via `mise x`, so mise-managed tools
# (gitleaks, hk) resolve without mise shell activation — e.g. from GUI git clients.
HK_MISE = "1"
MOD_LICENSE = "default_gnulgplv3"
MOD_CATEGORY = "content"
MOD_TAGS = "combat"
